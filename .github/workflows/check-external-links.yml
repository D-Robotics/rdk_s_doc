name: Check external links

# 站外链接巡检：每天定时跑一次，发现 404 时自动开/更新一个固定 issue。
# 不挂 PR 触发，因此不阻塞任何人提交或合并。
# 说明：本仓已有 onBrokenLinks + scripts/check-broken-links.js 覆盖「站内 / 跨仓」链接，
#       这里只补「站外（第三方）链接」的失效监测。

on:
  schedule:
    # 每天 UTC 03:37（北京时间 11:37），避开整点
    - cron: "37 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  check-external-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # 发现失效链接时不要让 job 失败，交给下面的通知步骤处理
          fail: false
          args: >-
            --no-progress
            --accept 200,204,301,302,307,308,401,403
            --timeout 15
            --retry-wait-time 2
            --max-retries 3
            --user-agent "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
            --exclude-loopback
            --exclude-all-private
            --exclude-mail
            --exclude 'developer\.d-robotics\.cc'
            --exclude 'archive\.d-robotics\.cc'
            --exclude 'oss-cn-beijing\.aliyuncs\.com'
            --exclude 'github\.com'
            --exclude '(taobao|tmall)\.com'
            --exclude 'e\.tb\.cn'
            --exclude 'feishu\.cn'
            --exclude 'bilibili\.com'
            --exclude 'csdn\.net'
            --exclude '\.(png|jpe?g|gif|svg|webp|ico)(\?.*)?$'
            --exclude '^https?://proxy_server_address'
            --exclude '^https?://IP([^a-z0-9]|$)'
            'docs/**/*.md'
            'docs/**/*.mdx'

      - name: Create or update issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPORT=./lychee/out.md
          TITLE="chore: 外链失效清单（自动巡检）"
          LABEL="broken-link"

          # label 不存在则创建（已存在会报错，忽略即可）
          gh label create "$LABEL" --color d73a4a 2>/dev/null || true

          has_failures() {
            [ -f "$REPORT" ] && grep -q '### Errors' "$REPORT"
          }
          issue_num() {
            gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty'
          }

          if has_failures; then
            BODY="## 外链失效清单"$'\n\n'
            BODY+="> 自动巡检时间：$(date -u '+%Y-%m-%d %H:%M UTC')"$'\n\n'
            BODY+="$(cat "$REPORT")"
            NUM="$(issue_num)"
            if [ -n "$NUM" ]; then
              gh issue edit "$NUM" --body "$BODY"
              echo "已更新 issue #$NUM"
            else
              gh issue create --title "$TITLE" --label "$LABEL" --body "$BODY"
              echo "已创建 issue"
            fi
          else
            NUM="$(issue_num)"
            if [ -n "$NUM" ]; then
              gh issue comment "$NUM" --body "✅ 本次巡检未发现失效外链，已全部恢复。"
              gh issue close "$NUM"
              echo "已关闭 issue #$NUM"
            else
              echo "无失效外链，无需通知"
            fi
          fi
