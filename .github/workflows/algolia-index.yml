name: Update Algolia search index

on:
  workflow_call:
    secrets:
      ALGOLIA_ADMIN_API_KEY:
        required: true
      OSS_ACCESS_KEY_ID:
        required: true
      OSS_ACCESS_KEY_SECRET:
        required: true
  workflow_dispatch:

concurrency:
  group: algolia-index-rdk_s_doc
  cancel-in-progress: false

jobs:
  algolia-index:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      - name: Wait for live site to refresh
        run: sleep 20

      - name: Crawl live site and update Algolia index
        env:
          ALGOLIA_ADMIN_API_KEY: ${{ secrets.ALGOLIA_ADMIN_API_KEY }}
          ALGOLIA_APP_ID: 1VU781LYTV
          ALGOLIA_INDEX_NAME: rdk_s_doc
          ALGOLIA_SITE_URL: https://developer.d-robotics.cc/rdk_s_doc/
        run: |
          if [ -z "$ALGOLIA_ADMIN_API_KEY" ]; then
            echo "Missing GitHub secret ALGOLIA_ADMIN_API_KEY (use Admin or Write API Key)."
            exit 1
          fi
          npm run algolia:index

      - name: Setup ossutil v2
        run: |
          if [ ! -x "$HOME/ossutil" ]; then
            curl -o ossutil.zip https://gosspublic.alicdn.com/ossutil/v2/2.1.2/ossutil-2.1.2-linux-amd64.zip
            unzip ossutil.zip
            cd ossutil-2.1.2-linux-amd64
            chmod 755 ossutil
            mv ossutil "$HOME/ossutil"
          fi

      # 覆盖式单文件上传：覆盖 OSS 上残留的旧 search-index.json（8 月过期产物）。
      # 不能带 -r / --update（那只会增不删），必须覆盖根下同名文件。
      - name: Upload easyops search-index.json to OSS
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
        run: |
          ~/ossutil cp scripts/_algolia_tmp/search-index.json \
            oss://cn-rdk-front-prod/rdk_s_doc/search-index.json \
            -e https://d-robotics.cc \
            -i $OSS_ACCESS_KEY_ID \
            -k $OSS_ACCESS_KEY_SECRET \
            --region cn-beijing \
            --retry-times=3
