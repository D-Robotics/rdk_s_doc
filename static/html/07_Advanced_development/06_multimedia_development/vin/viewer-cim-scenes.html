<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CIM 典型组合：四种场景</title>
<style>
  :root {

    --brand: #D5B763; --brand-soft: #FBF4E2; --brand-line: #E8D9AE;
    --page: #FFFFFF; --chrome: #FAFAFB; --chrome-br: #E7EAEF;
    --ctl-bg: #FFFFFF; --ctl-br: #DDE1E7; --ctl-fg: #40444C; --ctl-dim: #8A9099;
  }
  html[data-theme="dark"] {

    --brand: #E0C67E; --brand-soft: #2E2A1E; --brand-line: #5A5136;
    --page: #14161A; --chrome: #1A1D22; --chrome-br: #2A2E36;
    --ctl-bg: #22262D; --ctl-br: #343A44; --ctl-fg: #E6E8EC; --ctl-dim: #8A9099;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--page);
               -webkit-user-select: none; user-select: none;
               -webkit-tap-highlight-color: transparent; }
  body { font: 13px/1.5 -apple-system, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
         color: var(--ctl-fg); display: flex; flex-direction: column; }

  .bar { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
         padding: 8px 10px; background: var(--chrome);
         border-bottom: 2px solid var(--brand-soft); }
  .bar .title { font-weight: 600; margin-right: auto; white-space: nowrap; }
  button { font: inherit; color: var(--ctl-fg); background: var(--ctl-bg);
           border: 1px solid var(--ctl-br); border-radius: 6px; padding: 4px 10px;
           cursor: pointer; transition: background .12s, border-color .12s, color .12s; }
  button:hover { background: var(--brand-soft); border-color: var(--brand-line); color: var(--brand); }
  button:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
  .zoom { min-width: 54px; text-align: center; font-variant-numeric: tabular-nums;
          color: var(--brand); font-weight: 600; }

  /* flex:1 而不是 height:calc(100vh − 44px)——工具条实际高 47.5px，写死 44 会多出
     3.5px，bar+stage 超过视口，viewer 里平白多一条滚动条 */
  .stage { flex: 1 1 auto; min-height: 0; position: relative; overflow: hidden;
           background: var(--page); cursor: grab; touch-action: none; }
  .stage.grabbing { cursor: grabbing; }
  #canvas { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
  #canvas svg { display: block; pointer-events: none; }
  .stage.anim #canvas { transition: transform .2s cubic-bezier(.22,.61,.36,1); }
  .hint { position: absolute; left: 12px; bottom: 8px; font-size: 11px; color: var(--ctl-dim);
          pointer-events: none; }
  .srcnotes { padding: 26px 22px 44px; border-top: 1px solid var(--chrome-br); }

  #canvas { display: grid; grid-template-columns: repeat(2, 1757px);
            gap: 26px; padding: 24px; align-items: start; }
  .cell { margin: 0; cursor: pointer; }
  /* 标题在缩放画布内，会跟着一起缩，所以字号按画布单位给：fit 态缩放约 0.24–0.26，
     52px 渲染出来是 12–14px。给 15px 的话渲染只剩 3.9px，等于看不见。 */
  .cell .cap { font-size: 52px; line-height: 1.2; font-weight: 600;
               padding: 0 0 10px; white-space: nowrap; }
  .cell:hover .cap { color: var(--brand); }
  .cell svg, .cell img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <div class="bar">
    <span class="title">CIM 典型组合：四种场景</span>
    <button id="zoom-out" title="缩小（-）">&minus;</button>
    <span class="zoom" id="zoom-label">100%</span>
    <button id="zoom-in" title="放大（+）">+</button>
    <button id="fit" title="看全部（F）">看全部</button>
    <button id="one" title="原始比例（1）">1:1</button>
    <button id="reset" title="重置（R）">重置</button>
    <button id="theme" title="深浅色：跟随主站 / 深色 / 浅色（T 切换）">跟随主站</button>
  </div>
  <div class="stage" id="stage">
    <div id="canvas">
      <figure class="cell" data-fig="1">
        <figcaption class="cap">场景 1　4 路 RAW，全部 Online（OTF）输出至 ISP</figcaption>
        <img src="http://rdk-doc.oss-cn-beijing.aliyuncs.com/doc/img/07_Advanced_development/06_multimedia_development/vin/scenes/cim-scene1.png" width="1632" height="560" alt="场景 1　4 路 RAW，全部 Online（OTF）输出至 ISP" draggable="false">
      </figure>
      <figure class="cell" data-fig="2">
        <figcaption class="cap">场景 2　4 路 RAW，全部 Offline（DDR）输出至 ISP</figcaption>
        <img src="http://rdk-doc.oss-cn-beijing.aliyuncs.com/doc/img/07_Advanced_development/06_multimedia_development/vin/scenes/cim-scene2.png" width="1540" height="784" alt="场景 2　4 路 RAW，全部 Offline（DDR）输出至 ISP" draggable="false">
      </figure>
      <figure class="cell" data-fig="3">
        <figcaption class="cap">场景 3　4 路 RAW，1 路 Online + 3 路 Offline，分送两个 ISP</figcaption>
        <img src="http://rdk-doc.oss-cn-beijing.aliyuncs.com/doc/img/07_Advanced_development/06_multimedia_development/vin/scenes/cim-scene3.png" width="1631" height="1286" alt="场景 3　4 路 RAW，1 路 Online + 3 路 Offline，分送两个 ISP" draggable="false">
      </figure>
      <figure class="cell" data-fig="4">
        <figcaption class="cap">场景 4　4 路 YUV，Offline（DDR）输出至 PYM</figcaption>
        <img src="http://rdk-doc.oss-cn-beijing.aliyuncs.com/doc/img/07_Advanced_development/06_multimedia_development/vin/scenes/cim-scene4.png" width="1757" height="888" alt="场景 4　4 路 YUV，Offline（DDR）输出至 PYM" draggable="false">
      </figure>
    </div>
    <div class="hint">点某张放大 · 滚轮缩放 · 拖拽平移 · Esc 回到全部</div>
  </div>

<script>
(function () {
  var GRID   = true;
  var stage  = document.getElementById('stage');
  var canvas = document.getElementById('canvas');
  var label  = document.getElementById('zoom-label');
  var scale = 1, tx = 0, ty = 0;

  function apply() {
    canvas.style.transform = 'translate3d(' + tx + 'px,' + ty + 'px,0) scale(' + scale + ')';
    label.textContent = Math.round(scale * 100) + '%';
  }
  // 量布局尺寸而非 getBoundingClientRect：后者在过渡进行中返回插值，再除以目标
  // scale 会算出错误的宽高——过渡那 200ms 内按 F/Esc 就会 fit 歪。
  function size() { return { w: canvas.offsetWidth, h: canvas.offsetHeight }; }
  function ease(animate) {
    stage.classList.toggle('anim', !!animate);
    if (animate) setTimeout(function () { stage.classList.remove('anim'); }, 220);
  }
  function place(s, animate) {
    var b = size(), r = stage.getBoundingClientRect();
    ease(animate); scale = s;
    tx = (r.width  - b.w * s) / 2;
    ty = (r.height - b.h * s) / 2;
    apply();
  }
  // 宽高同时满足，且单图封顶 1。只按宽度算的话，父页面给的 iframe 矮一点就会裁掉
  // 画布下半截；两个方向都取小值，高度写错最多是图略小，永远不裁切。
  function fit(animate) {
    var b = size();
    var s = Math.min((stage.clientWidth - 24) / b.w, (stage.clientHeight - 24) / b.h);
    place(Math.min(GRID ? 1.5 : 1, s), animate);
  }

  function zoomTo(ns, cx, cy, animate) {
    ns = Math.min(8, Math.max(0.1, ns));
    ease(animate);
    tx = cx - (cx - tx) * (ns / scale);
    ty = cy - (cy - ty) * (ns / scale);
    scale = ns; apply();
  }

  // 点某格 → 该格填满 stage。#canvas 是 offsetParent，故 offset* 直接就是画布本地坐标
  function focusCell(cell) {
    var u = cell.offsetLeft, v = cell.offsetTop;
    var w = cell.offsetWidth, h = cell.offsetHeight;
    var ns = Math.min(4, (stage.clientWidth - 40) / w, (stage.clientHeight - 40) / h);
    ease(true); scale = ns;
    tx = stage.clientWidth  / 2 - (u + w / 2) * ns;
    ty = stage.clientHeight / 2 - (v + h / 2) * ns;
    apply();
  }

  document.getElementById('zoom-in').onclick  = function () { zoomTo(scale * 1.3, stage.clientWidth / 2, stage.clientHeight / 2, true); };
  document.getElementById('zoom-out').onclick = function () { zoomTo(scale / 1.3, stage.clientWidth / 2, stage.clientHeight / 2, true); };
  document.getElementById('fit').onclick      = function () { fit(true); };
  document.getElementById('one').onclick      = function () { place(1, true); };
  document.getElementById('reset').onclick    = function () { place(1, true); setTimeout(function () { fit(true); }, 215); };
  // ---- 主题：默认跟随主站（文档站把主题写在 <html data-theme>），手动可覆盖 ----
  var MODES = ['auto', 'dark', 'light'];
  var MODE_LABEL = { auto: '跟随主站', dark: '深色', light: '浅色' };
  var mode = 'auto', applied = null;

  function siteTheme() {
    try {
      if (window.parent && window.parent !== window) {
        var t = window.parent.document.documentElement.getAttribute('data-theme');
        if (t === 'dark' || t === 'light') return t;
      }
    } catch (e) { /* 跨域时退回系统偏好 */ }
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  function applyTheme(t) {
    if (t !== applied) { applied = t; document.documentElement.setAttribute('data-theme', t); }
    document.getElementById('theme').textContent = MODE_LABEL[mode];
  }
  function syncTheme() { if (mode === 'auto') applyTheme(siteTheme()); }

  document.getElementById('theme').onclick = function () {
    mode = MODES[(MODES.indexOf(mode) + 1) % MODES.length];
    applied = null;
    applyTheme(mode === 'auto' ? siteTheme() : mode);
  };
  try {
    new MutationObserver(syncTheme).observe(
      window.parent.document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  } catch (e) {}
  setInterval(syncTheme, 500);          // MutationObserver 的兜底

  stage.addEventListener('wheel', function (e) {
    e.preventDefault();
    var r = stage.getBoundingClientRect();
    zoomTo(scale * (e.deltaY < 0 ? 1.12 : 0.89), e.clientX - r.left, e.clientY - r.top, false);
  }, { passive: false });

  // 拖拽平移：挡掉默认文本选择 + 3px 启动阈值（避免点击被当成拖拽）
  var down = false, moved = false, sx = 0, sy = 0, lx = 0, ly = 0, vx = 0, vy = 0, raf = 0;
  var THRESHOLD = 3;

  stage.addEventListener('pointerdown', function (e) {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    cancelAnimationFrame(raf);
    down = true; moved = false;
    sx = lx = e.clientX; sy = ly = e.clientY; vx = vy = 0;
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  });

  stage.addEventListener('pointermove', function (e) {
    if (!down) return;
    if (!moved && Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy) < THRESHOLD) return;
    if (!moved) { moved = true; stage.classList.add('grabbing'); }
    vx = e.clientX - lx; vy = e.clientY - ly;
    tx += vx; ty += vy; lx = e.clientX; ly = e.clientY;
    apply();
  });

  function release(e) {
    if (!down) return;
    down = false;
    stage.classList.remove('grabbing');
    try { stage.releasePointerCapture(e.pointerId); } catch (_) {}
    if (!moved) {
      // 指针被 stage 捕获，事件 target 恒为 stage，只能按坐标找落点
      if (GRID) {
        var hit = document.elementFromPoint(e.clientX, e.clientY);
        var cell = hit && hit.closest && hit.closest('.cell');
        if (cell) focusCell(cell); else fit(true);
      }
      return;
    }
    (function glide() {                       // 轻微惯性，跟手一点
      vx *= 0.92; vy *= 0.92;
      if (Math.abs(vx) < 0.4 && Math.abs(vy) < 0.4) return;
      tx += vx; ty += vy; apply();
      raf = requestAnimationFrame(glide);
    })();
  }
  stage.addEventListener('pointerup', release);
  stage.addEventListener('pointercancel', release);
  stage.addEventListener('dragstart', function (e) { e.preventDefault(); });
  stage.addEventListener('selectstart', function (e) { e.preventDefault(); });
  stage.addEventListener('dblclick', function () { fit(true); });

  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === '+' || k === '=') document.getElementById('zoom-in').click();
    else if (k === '-' || k === '_') document.getElementById('zoom-out').click();
    else if (k === 'f' || k === 'F') fit(true);
    else if (k === '1') place(1, true);
    else if (k === 'r' || k === 'R') { place(1, false); setTimeout(function () { fit(true); }, 20); }
    else if (k === 't' || k === 'T') document.getElementById('theme').click();
    else if (GRID && k === 'Escape') fit(true);
  });

  var q = new URLSearchParams(location.search).get('theme');
  if (q === 'dark' || q === 'light') mode = q;   // 显式指定则不跟随
  applyTheme(mode === 'auto' ? siteTheme() : mode);

  window.addEventListener('resize', function () { fit(false); });
  fit(false);
})();
</script>
</body>
</html>
